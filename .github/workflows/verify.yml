name: verify

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Compact devtools
        shell: bash
        run: |
          curl --proto '=https' -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          compact update 0.30.0
      - run: npm ci
      - run: npm run compact
      - run: npm run build
      - run: npm test
